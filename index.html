    <script>
      // Set the theme before first paint. Doing it from React means one frame
      // of the wrong theme on every load — a white flash for anyone in dark
      // mode — because React has not run yet when the page first draws.
      (function () {
        try {
          var saved = localStorage.getItem("theme");
          var dark = saved ? saved === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script>
      (function() {
        try {
          var redirectPath = sessionStorage.getItem('gh:redirect');
          if (redirectPath && redirectPath.startsWith('/')) {
            sessionStorage.removeItem('gh:redirect');
            var base = '/amritaraj-nair-portfolio';
            var normalized = redirectPath.replace(new RegExp('^' + base), '');
            if (normalized && normalized !== '/') {
              window.history.replaceState(null, '', base + normalized);
            }
          }
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
