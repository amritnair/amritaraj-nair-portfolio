# Every other day, bump each project's dependencies within their existing
# version ranges, committed only if the build still passes. Otherwise it just
# records the date in .last-refresh.
# Needs secret REFRESH_TOKEN: fine-grained PAT, Contents read/write on these repos.
name: refresh

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repo:
          - amritaraj-nair-portfolio
          - Harbor
          - hookemhacks
    timeout-minutes: 330
    steps:
      # Scheduled runs: each repo refreshes on about half of days, at a
      # random time between 06:00 and 11:00 UTC.
      - name: Random day and time
        id: roll
        if: github.event_name == 'schedule'
        run: |
          if [ $((RANDOM % 2)) = 0 ]; then echo skip=1 >> "$GITHUB_OUTPUT"; exit 0; fi
          sleep $((RANDOM % 18000))
      - uses: actions/checkout@v4
        if: steps.roll.outputs.skip != '1'
        with:
          repository: amritnair/${{ matrix.repo }}
          token: ${{ secrets.REFRESH_TOKEN }}
      - uses: actions/setup-node@v4
        if: steps.roll.outputs.skip != '1' && hashFiles('package-lock.json') != ''
        with:
          node-version: 22
      - name: Update and verify
        id: update
        if: steps.roll.outputs.skip != '1'
        continue-on-error: true
        run: |
          if [ -f package-lock.json ]; then
            npm update --package-lock-only
            git diff --quiet || { npm ci && npm run build --if-present; }
          elif [ -f Cargo.lock ]; then
            cargo update
            git diff --quiet || cargo build
          fi
      - name: Commit
        if: steps.roll.outputs.skip != '1'
        run: |
          git config user.name amritnair
          git config user.email 171728749+amritnair@users.noreply.github.com
          if [ "${{ steps.update.outcome }}" = success ] && ! git diff --quiet; then
            git commit -am "Update dependencies"
          else
            git reset --hard -q
            date -u +%FT%TZ > .last-refresh
            git add .last-refresh
            git commit -m "Update last refresh date"
          fi
          git push
